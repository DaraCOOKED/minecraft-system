# Tells the server about our plugin
name: QuestMaster
version: 1.0.0
main: com.questmaster.QuestMasterPlugin
api-version: '1.21'   # works for all 1.21.x versions
description: Role, progression and quest system.

commands:
  role:
    description: View or choose your role
    usage: /role [list | choose <role>]
    permission: questmaster.role

permissions:
  questmaster.role:
    description: Allows using /role
    default: true   # everyone can use it